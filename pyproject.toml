[project]
name = "frameproof"
version = "0.1.0"
description = "An independent verifier for AI-written code-to-video (HyperFrames HTML): it compiles the brief into checks, probes the rendered composition, and blocks what fails."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "openai>=1.50",
  "playwright>=1.48",
  "numpy>=1.26",
  "pillow>=10.4",
  "google-adk>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
frameproof = "frameproof.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs Playwright Chromium installed"]
